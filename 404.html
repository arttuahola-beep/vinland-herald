<style>
:root{--ink:#1b1a17;--paper:#f6f1e4;--rule:#2a2824;--muted:#5a554b}

.links a{color:var(--ink)}
footer{margin-top:22px;border-top:4px double var(--rule);padding-top:8px;font-size:12px;color:var(--muted);font-family:"Old Standard TT",serif}
